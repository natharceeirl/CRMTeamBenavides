# Entorno QA independiente: Caddy (HTTPS y la web), la API y PostgreSQL 18.
# Aislado por completo de producción: proyecto, red, volúmenes, base, usuario y respaldos propios.
#
#   cp .env.qa.ejemplo .env      # y reemplazar todos los marcadores REEMPLAZAR_CON_*
#   docker compose -f docker-compose.qa.yml build api
#   docker compose -f docker-compose.qa.yml build caddy
#   docker compose -f docker-compose.qa.yml up -d
#
# IMPORTANTE: nunca usar «up --build» en servidores de 2 GB RAM; compilar api y caddy de a una.
# Guía completa de aprovisionamiento, migraciones y operación: docs/qa.md.

name: crm-team-benavides-qa

x-registro-qa: &registro-qa
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_teambenavides_qa}
      POSTGRES_USER: ${POSTGRES_USER:-crm_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env de QA}
    volumes:
      - base-qa:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks: [interna-qa]
    logging: *registro-qa

  api:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-crm_teambenavides_qa};Username=${POSTGRES_USER:-crm_qa};Password=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env de QA};Gss Encryption Mode=Disable
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env de QA}
      Proxy__RedesConfiables__0: ${RED_INTERNA_QA:-172.31.0.0/24}
      Notificaciones__Proveedor: ${NOTIFICACIONES_PROVEEDOR:-Registro}
      Notificaciones__Firebase__CredencialesJson: ${FIREBASE_CREDENCIALES_JSON:-}
      Decolecta__Token: ${DECOLECTA_TOKEN:-}
      # Yamaha v3: siempre deshabilitado por defecto en QA.
      YamahaApi__Enabled: ${YAMAHA_ENABLED:-false}
      YamahaApi__CodigoPuntoVenta: ${YAMAHA_CODIGO_PUNTO_VENTA:-}
      YamahaApi__NombreComercialPuntoVenta: ${YAMAHA_NOMBRE_COMERCIAL_PUNTO_VENTA:-Team Benavides QA}
      YamahaApi__TipoPuntoVenta: ${YAMAHA_TIPO_PUNTO_VENTA:-3S}
      YamahaApi__VentasEndpointUrl: ${YAMAHA_VENTAS_ENDPOINT_URL:-}
      YamahaApi__StockEndpointUrl: ${YAMAHA_STOCK_ENDPOINT_URL:-}
      YamahaApi__ServicioTecnicoEndpointUrl: ${YAMAHA_SERVICIO_TECNICO_ENDPOINT_URL:-}
      YamahaApi__FunctionKey: ${YAMAHA_FUNCTION_KEY:-}
      YamahaApi__VentasFunctionKey: ${YAMAHA_VENTAS_FUNCTION_KEY:-}
      YamahaApi__StockFunctionKey: ${YAMAHA_STOCK_FUNCTION_KEY:-}
      YamahaApi__ServicioTecnicoFunctionKey: ${YAMAHA_SERVICIO_TECNICO_FUNCTION_KEY:-}
      YamahaApi__HoraCierreStockPeru: ${YAMAHA_HORA_CIERRE_STOCK_PERU:-22:00}
      YamahaApi__HoraLimiteRecuperacionStockPeru: ${YAMAHA_HORA_LIMITE_RECUPERACION_STOCK_PERU:-08:00}
      YamahaApi__TimeoutSeconds: ${YAMAHA_TIMEOUT_SECONDS:-60}
      # WhatsApp Business Cloud API: deshabilitado y en modo Mock por defecto en QA.
      WhatsApp__Enabled: ${WHATSAPP_ENABLED:-false}
      WhatsApp__Provider: ${WHATSAPP_PROVIDER:-Mock}
      WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WhatsApp__BusinessAccountId: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}
      WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-}
      WhatsApp__WebhookVerifyToken: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WhatsApp__GraphApiVersion: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      WhatsApp__TimeoutSeconds: ${WHATSAPP_TIMEOUT_SECONDS:-30}
      # WhatsApp IA conversacional: deshabilitada y en modo Mock por defecto en QA.
      WhatsAppAi__Enabled: ${WHATSAPP_AI_ENABLED:-false}
      WhatsAppAi__Provider: ${WHATSAPP_AI_PROVIDER:-Mock}
      WhatsAppAi__Model: ${WHATSAPP_AI_MODEL:-mock-deterministic-v1}
      WhatsAppAi__ApiKey: ${WHATSAPP_AI_API_KEY:-}
      WhatsAppAi__ApiBaseUrl: ${WHATSAPP_AI_BASE_URL:-}
      WhatsAppAi__TimeoutSeconds: ${WHATSAPP_AI_TIMEOUT_SECONDS:-10}
      WhatsAppAi__MaxOutputTokens: ${WHATSAPP_AI_MAX_OUTPUT_TOKENS:-350}
      WhatsAppAi__MaxBotOutboxAgeMinutes: ${WHATSAPP_AI_MAX_BOT_OUTBOX_AGE_MINUTES:-15}
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes:
      - datos-api-qa:/datos
    networks: [interna-qa]
    logging: *registro-qa

  respaldo:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/respaldo-qa.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-crm_teambenavides_qa}
      PGUSER: ${POSTGRES_USER:-crm_qa}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env de QA}
      HORA_RESPALDO: ${HORA_RESPALDO:-03:00}
      RETENCION_DIAS: ${RETENCION_DIAS:-7}
    volumes:
      - ./respaldo-qa.sh:/respaldo-qa.sh:ro
      - ./respaldos-qa:/respaldos
    healthcheck:
      test: ["CMD-SHELL", "find /respaldos -name 'crm-qa-*.dump' -mmin -1560 | grep -q ."]
      interval: 10m
      start_period: 5m
      start_interval: 15s
    networks: [interna-qa]
    logging: *registro-qa

  caddy:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env de QA}
      HSTS_SEGUNDOS: ${HSTS_SEGUNDOS:-0}
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
      - "${PUERTO_HTTPS:-443}:443/udp"
    volumes:
      - ./Caddyfile.qa:/etc/caddy/Caddyfile:ro
      - caddy-datos-qa:/data
      - caddy-config-qa:/config
    networks: [interna-qa]
    logging: *registro-qa

networks:
  interna-qa:
    name: crm-team-benavides-qa_interna
    ipam:
      config:
        - subnet: ${RED_INTERNA_QA:-172.31.0.0/24}

volumes:
  base-qa:
    name: crm-team-benavides-qa_base
  datos-api-qa:
    name: crm-team-benavides-qa_datos-api
  caddy-datos-qa:
    name: crm-team-benavides-qa_caddy-datos
  caddy-config-qa:
    name: crm-team-benavides-qa_caddy-config
